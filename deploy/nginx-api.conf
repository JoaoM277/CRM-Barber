# ==========================================================================
#  Nginx — API Laravel (backend/crm-barber/public)
#  Copie para /etc/nginx/sites-available/api-crm-barber e link em sites-enabled
#  (se usar CloudPanel, cole o conteúdo do bloco `location` no vhost gerado
#  por ele em vez de usar este arquivo inteiro — o CloudPanel já monta o
#  server{} e o TLS pra você).
#
#  Troque:
#    api.SEUDOMINIO.com   -> seu (sub)domínio da API
#    /var/www/crm-barber  -> caminho onde o repo foi clonado
#    php8.3-fpm.sock      -> versão do PHP-FPM instalada
# ==========================================================================
server {
    listen 80;
    server_name api.SEUDOMINIO.com;

    root /var/www/crm-barber/backend/crm-barber/public;
    index index.php;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/crm-barber-api.access.log;
    error_log  /var/log/nginx/crm-barber-api.error.log;
}
