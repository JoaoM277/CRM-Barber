# ==========================================================================
#  Nginx — front-end estático (site de agendamento + painel)
#  Troque:
#    agendar.SEUDOMINIO.com -> seu (sub)domínio do front
#    /var/www/crm-barber    -> caminho onde o repo foi clonado
# ==========================================================================
server {
    listen 80;
    server_name agendar.SEUDOMINIO.com;

    root /var/www/crm-barber/front-end;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # cache normal pros assets versionados (?v=...); o HTML nunca fica em cache
    # forte porque é ele que muda o ?v= a cada release.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/crm-barber-front.access.log;
    error_log  /var/log/nginx/crm-barber-front.error.log;
}
