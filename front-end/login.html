<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Administrativo</title>
    <style>
        :root {
            --brand-primary: #d4af37; /* Dourado/Amarelo da barbearia */
            --brand-bg-dark: #121212;
            --brand-surface: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --danger: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--brand-bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background-color: var(--brand-surface);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 24px;
            color: var(--brand-primary);
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #2b2b2b;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--brand-primary);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--brand-primary);
            color: var(--brand-bg-dark);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        /* Toast de Erro na tela de login */
        .login-toast {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .login-toast.erro {
            background-color: rgba(255, 77, 77, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            display: block;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h1>Área Restrita</h1>
            <p>Faça login para gerenciar a barbearia</p>
        </div>

        <form id="form-login">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="admin@barbearia.com">
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-login" id="btn-entrar">Entrar no Painel</button>
        </form>

        <div id="login-feedback" class="login-toast"></div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
