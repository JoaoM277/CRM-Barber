<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Vellis</title>
    <link rel="stylesheet" href="css/auth.css?v=20261010a">
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="marca">Vellis</div>
            <h1>Entrar</h1>
            <p>Acesse o painel da sua barbearia</p>
        </div>

        <form id="form-login">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="admin@barbearia.com">
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-login" id="btn-entrar">Entrar no Painel</button>
        </form>

        <div class="login-links">
            <a href="esqueci-senha.html">Esqueci minha senha</a>
            <a href="cadastro.html">Criar conta grátis</a>
        </div>

        <div id="login-feedback" class="login-toast"></div>
    </div>

    <script src="js/env.js"></script>
    <script src="js/config.js?v=20261007a"></script>
    <script src="js/login.js?v=20261009b"></script>
</body>
</html>
