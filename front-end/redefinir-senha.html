<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Nova senha | Vellis</title>
    <link rel="stylesheet" href="css/auth.css?v=20261009a">
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="marca">Vellis</div>
            <h1>Criar nova senha</h1>
            <p id="red-email"></p>
        </div>

        <form id="form-redefinir">
            <div class="input-group">
                <label for="red-senha">Nova senha</label>
                <input type="password" id="red-senha" required minlength="6" autocomplete="new-password">
                <div class="input-ajuda">Mínimo de 6 caracteres.</div>
            </div>
            <div class="input-group">
                <label for="red-confirma">Repita a nova senha</label>
                <input type="password" id="red-confirma" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn-login" id="btn-redefinir">Salvar nova senha</button>
        </form>

        <div id="auth-feedback" class="login-toast" role="alert"></div>

        <div class="login-links centro">
            <a href="login.html">Ir para o login</a>
        </div>
    </div>

    <script src="js/env.js"></script>
    <script src="js/config.js?v=20261007a"></script>
    <script src="js/auth.js?v=20261009b"></script>
</body>
</html>
